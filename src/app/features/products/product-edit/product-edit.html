<div class="edit-container">
  <h2>Edit Product</h2>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="productName">Product Name</label>
      <input id="productName" type="text" formControlName="productName" class="form-control" />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" formControlName="category" class="form-control">
        <option value="Laptops">Laptops</option>
        <option value="Mobiles">Mobiles</option>
        <option value="Tablets">Tablets</option>
      </select>
    </div>

    <div class="form-group">
      <label for="subCategory">Sub Category</label>
      <input id="subCategory" type="text" formControlName="subCategory" class="form-control" />
    </div>

    <div class="form-group">
      <label for="price">Price (INR)</label>
      <input id="price" type="number" formControlName="price" class="form-control" />
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" formControlName="status" class="form-control">
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid">Save Changes</button>
    </div>
  </form>
</div>
