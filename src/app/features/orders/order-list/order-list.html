<div class="order-list-container">
  <div class="header-actions">
    <h2>Orders List</h2>
    <!-- Optionally add a button to route back to creating a new order -->
    <a href="/orders/new" class="btn btn-primary">+ Create New Order</a>
  </div>

  <!-- Reusing the Universal Data Grid -->
  <app-data-grid
    [data]="orders"
    [columns]="columns"
    [totalRecords]="totalRecords"
    [cellTemplates]="cellTemplates"
    (stateChange)="onGridStateChange($event)">
  </app-data-grid>

  <!-- Custom Cell Templates -->
  <ng-template #totalTemplate let-row>
    <strong>{{ row.totalAmount | customCurrency:'prefix' }}</strong>
  </ng-template>
</div>
