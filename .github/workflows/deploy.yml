name: MYO-TECH Angular Assignment Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23' 
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Updated base-href to match your exact GitHub repository name
      - name: Build Angular Project
        run: npx ng build --configuration production --base-href /myo-tech-angular-assignment/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Path configured for your specific project name and Angular 17+
          publish_dir: ./dist/myo-tech-angular-assignment/browser